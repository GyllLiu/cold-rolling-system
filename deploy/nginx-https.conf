limit_req_zone $binary_remote_addr zone=cold_capture_login:1m rate=6r/m;
log_format cold_capture_timing escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"request_bytes":$request_length,"response_bytes":$bytes_sent,"total_s":$request_time,"upstream_s":"$upstream_response_time","connect_s":"$upstream_connect_time","header_s":"$upstream_header_time","request_id":"$request_id"}';

server {
    listen 80;
    server_name 8.221.114.18;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/cold-rolling/acme;
        default_type text/plain;
    }
    location / { return 308 https://8.221.114.18$request_uri; }
}

server {
    listen 443 ssl;
    server_name 8.221.114.18;
    ssl_certificate /etc/letsencrypt/live/cold-rolling-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cold-rolling-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:cold_rolling_tls:10m;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Frame-Options SAMEORIGIN always;
    access_log /var/log/nginx/cold-rolling-access.log;
    error_log /var/log/nginx/cold-rolling-error.log;

    location = /api/capture/auth {
        limit_req zone=cold_capture_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location ^~ /api/capture/ {
        access_log /var/log/nginx/cold-rolling-access.log;
        access_log /var/log/nginx/cold-rolling-capture-timing.log cold_capture_timing;
        proxy_pass http://127.0.0.1:8101;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    location / {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
